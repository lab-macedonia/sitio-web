name: Sincronizar Instagram autorizado
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,9,15,21 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  synchronize:
    if: github.repository == 'lab-macedonia/sitio-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar configuración segura
        id: token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
        run: |
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ] || [ -n "$BEHOLD_FEED_URL" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Instalar dependencias
        if: steps.token.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      - name: Importar publicaciones nuevas
        if: steps.token.outputs.enabled == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
        run: python scripts/sync_instagram.py
      - name: Proponer las nuevas noticias (pull request para revisar)
        if: steps.token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias/
          if git diff --cached --quiet; then
            echo "Sin noticias nuevas."
            exit 0
          fi
          git checkout -b instagram-sync
          git commit -m "Noticias: sincronización autorizada de Instagram"
          git push --force origin instagram-sync
          if [ -z "$(gh pr list --head instagram-sync --state open --json number -q '.[0].number')" ]; then
            gh pr create --base main --head instagram-sync \
              --title "Noticias nuevas desde Instagram (revisar y aprobar)" \
              --body "Publicaciones importadas automáticamente. Revisa títulos, fechas y textos antes de aprobar: al fusionar este cambio se publica en el sitio. Si algo no corresponde, edita o elimina la carpeta de esa noticia en esta rama."
          fi
