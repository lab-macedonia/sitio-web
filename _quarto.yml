project:
  type: website
  output-dir: _site
  render:
  - "*.qmd"
  - "noticias/**/*.qmd"
  resources:
  - assets/**
  - enlaces/**
  - robots.txt
website:
  title: Laboratorio MACEDONIA
  description: MACEDONIA · Investigación y docencia en química orgánica, química general y ciencias, educación química e innovación para la formación
    docente en la UMCE.
  site-url: https://lab-macedonia.github.io/sitio-web/
  favicon: assets/favicon-macedonia-64.png
  search:
    location: navbar
    type: overlay
  page-navigation: true
  navbar:
    title: MACEDONIA
    logo: assets/macedonia-mejorado-icono-oscuro.svg
    logo-alt: Logotipo del Laboratorio MACEDONIA
    background: '#062a4d'
    foreground: '#ffffff'
    pinned: true
    collapse-below: xl
    left:
    - text: Inicio
      href: index.qmd
    - text: El laboratorio
      menu:
      - text: Presentación
        href: presentacion.qmd
      - text: Historia e identidad
        href: historia.qmd
      - text: Propósito, misión y visión
        href: proposito.qmd
      - text: Equipo y redes
        href: equipo.qmd
      - text: Perfil académico
        href: perfil.qmd
      - text: Visitas de colegios
        href: visitas-colegios.qmd
      - text: Charlas y actividades en tu colegio
        href: charlas-colegios.qmd
    - text: Investigación
      menu:
      - text: Líneas de investigación
        href: investigacion.qmd
      - text: Proyectos
        href: proyectos.qmd
    - text: Producción académica
      menu:
      - text: Artículos y capítulos
        href: publicaciones.qmd
      - text: Congresos
        href: congresos.qmd
      - text: Tesistas
        href: tesistas.qmd
    - text: Recursos educativos
      menu:
      - text: Laboratorio digital
        href: laboratorio-digital.qmd
      - text: Animaciones de química orgánica
        href: animaciones.qmd
    - text: Actualidad
      href: noticias.qmd
    right:
    - text: English
      href: en/index.html
    - icon: instagram
      href: https://www.instagram.com/labmacedonia/
      aria-label: Instagram de MACEDONIA
    - text: Contacto
      href: contacto.qmd
  page-footer:
    border: true
    left: © Laboratorio MACEDONIA · Universidad Metropolitana de Ciencias de la Educación
    center: Química orgánica · Química general · Ciencias · Educación química
    right: '[Instagram](https://www.instagram.com/labmacedonia/) · [Contacto](/contacto.qmd)'
  back-to-top-navigation: true
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/lab-macedonia/sitio-web
  repo-actions:
  - source
format:
  html:
    theme:
      light: [cosmo, styles/theme.scss]
      dark: [darkly, styles/theme.scss]
    respect-user-color-scheme: true
    css: styles/site.css
    include-in-header:
      - assets/preload-fonts.html
      - assets/goatcounter.html
    toc: true
    lang: es
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: false
    include-after-body:
      - assets/catalog-filters.html
      - assets/backtotop.html
execute:
  freeze: auto
